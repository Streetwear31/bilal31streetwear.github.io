<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BILAL 31</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .logo {
            display: block;
            width: 230px;
            max-width: 80%;
            height: auto;
            margin: 10px auto 25px;
        }

        .subtitle {
            color: #d4af37;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .location {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 17px 20px;
            margin: 14px 0;
            border: 1px solid #d4af37;
            border-radius: 12px;
            background: #111111;
            color: #ffffff;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
        }

        .button:hover {
            background: #d4af37;
            color: #000000;
        }

        .footer {
            margin-top: 35px;
            color: #666666;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <img
        src="logo.jpeg"
        class="logo"
        alt="BILAL 31 Logo"
    >

    <div class="subtitle">
        Streetwear & Sérigraphie
    </div>

    <div class="location">
        Oran • Algérie
    </div>

    <a class="button" href="#">
        Facebook
    </a>

    <a class="button" href="#">
        WhatsApp
    </a>

    <a class="button" href="#">
        📍 Notre Boutique
    </a>

    <div class="footer">
        © BILAL 31 • Oran, Algérie
    </div>

</div>

</body>
</html>
