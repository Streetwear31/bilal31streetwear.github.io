<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILAL 31</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .logo {
            width: 230px;
            max-width: 80%;
            margin: 10px auto 20px;
            display: block;
        }

        .subtitle {
            color: #d4af37;
            font-size: 17px;

            font-weight: bold;
        }

        .location {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 17px 20px;
            margin: 14px 0;
            border: 1px solid #d4af37;
            border-radius: 12px;
            background: #111111;
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
        }

        .button:hover {
            background: #d4af37;
            color: #000000;
        }

        .footer {
            margin-top: 35px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <img src=WhatsApp-Bild%20am%2015.09.2026%20um%2021.51.34.jpeg class="logo" alt="BILAL 31 Logo">

        Streetwear & Sérigraphie
    </div>

    <div class="location">

    </div>

    <a class="button" href="DEIN_FACEBOOK_LINK">

    </a>

    <a class="button" href="DEIN_INSTAGRAM_LINK">

    </a>

    </a>

    <a class="button" href="DEIN_WHATSAPP_LINK">
        WhatsApp
    </a>

    <a class="button" href="DEIN_GOOGLE_MAPS_LINK">
        📍 Notre Boutique
    </a>

    <div class="footer">
        © BILAL 31 • Oran, Algérie
    </div>

</div>

</html>
